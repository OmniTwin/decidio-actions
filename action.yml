name: Decidio deploy approvals
description: A deploy waits until a teammate approves it in Decidio, Slack or on their phone - then Decidio starts it, and the deploy proves the approval once.
author: Decidio
branding:
  icon: user-check
  color: green
inputs:
  step:
    description: "request - in the workflow that runs on push: ask for approval. verify - the FIRST step of the deploy job Decidio starts: prove the approval before anything deploys."
    required: true
  environment:
    description: (request) The deployment environment to ask for - one the repository was set up with in Decidio.
    required: false
    default: ""
  justification:
    description: (request, optional) One line on what changed - needed to ask again after a teammate refused this commit.
    required: false
    default: ""
  decision:
    description: (verify) The approval Decidio passed when it started this run - set it to the workflow's decidio input.
    required: false
    default: ""
  api-url:
    description: Decidio's API address.
    required: false
    default: https://mcp.decidioai.com
outputs:
  decision:
    description: (request) route - a teammate approves next; proceed - no approval needed, Decidio starts the deploy. (verify) The approval that was used.
    value: ${{ steps.run.outputs.decision }}
  decision-id:
    description: (request) The request's id in Decidio.
    value: ${{ steps.run.outputs.decision-id }}
  url:
    description: (request) The request's page in Decidio.
    value: ${{ steps.run.outputs.url }}
  sha:
    description: (verify) The approved commit - check out and deploy exactly this.
    value: ${{ steps.run.outputs.sha }}
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        DECIDIO_STEP: ${{ inputs.step }}
        DECIDIO_ENVIRONMENT: ${{ inputs.environment }}
        DECIDIO_JUSTIFICATION: ${{ inputs.justification }}
        DECIDIO_DECISION: ${{ inputs.decision }}
        DECIDIO_API_URL: ${{ inputs.api-url }}
        # v1.2: read a push's changed files from GitHub (names and counts) - this job's own token, sent to GitHub only.
        DECIDIO_GITHUB_TOKEN: ${{ github.token }}
      run: bash "$GITHUB_ACTION_PATH/run.sh"
